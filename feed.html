<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News briefing</title>
  <link rel="stylesheet" href="feed.css">
  <script src="feed.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="briefing"><p id="date"></p></header>
    <div id="widget-grid" class="widget-grid" aria-label="Widget grid">
    <section id="google-widget" class="widget" aria-labelledby="section-title">
      <div class="widget-header"><div><p class="eyebrow" id="widget-label">THE LATEST</p><h2 id="section-title">Top stories</h2></div><div class="widget-actions"><button id="refresh" type="button">Refresh</button><button id="remove-google" type="button">Remove</button></div></div>
      <p id="status" role="status" aria-live="polite">Loading headlines…</p>
      <div id="feed" class="stories"></div>
    </section>
    </div>
    <section class="add-widget" aria-labelledby="add-title">
      <h2 id="add-title">Add an RSS widget</h2>
      <button id="add-google" type="button" hidden>Add Google News widget</button>
      <form id="rss-form"><label for="rss-title" id="rss-title-label">Widget title (optional)</label><input id="rss-title" class="rss-title-input" type="text" maxlength="200"><label for="rss-url" id="rss-label">RSS feed URL</label><div class="form-row"><input id="rss-url" type="url" required placeholder="https://rss.news.yahoo.com/rss/topstories"><label class="count-label" for="rss-count">Posts <input id="rss-count" type="number" min="1" max="50" value="12" required></label><button id="add-rss" type="submit">Add widget</button></div><p id="rss-form-status" role="status" aria-live="polite"></p></form>
    </section>
    <section class="add-widget" aria-labelledby="forex-add-title">
      <h2 id="forex-add-title">Add Forex News widget</h2>
      <form id="forex-form"><label for="forex-key">Forex News API key</label><div class="form-row"><input id="forex-key" type="password" autocomplete="off" required><button id="add-forex" type="submit">Add Forex News widget</button></div><p id="forex-form-status" role="status" aria-live="polite"></p></form>
    </section>
    <section class="add-widget" aria-labelledby="iframe-add-title">
      <h2 id="iframe-add-title">Add website widget</h2>
      <form id="iframe-add-form">
        <label for="iframe-add-title-input" id="iframe-title-label">Title (optional)</label><input class="rss-title-input" id="iframe-add-title-input" type="text" maxlength="200">
        <label for="iframe-add-url" id="iframe-url-label">Website URL</label><input class="rss-title-input" id="iframe-add-url" type="url" required placeholder="https://example.com">
        <div class="iframe-dimensions"><label for="iframe-add-width" id="iframe-width-label">Width (px)</label><input id="iframe-add-width" type="number" min="100" max="3000" value="600" required><label for="iframe-add-height" id="iframe-height-label">Height (px)</label><input id="iframe-add-height" type="number" min="100" max="3000" value="400" required><button id="iframe-add-button" type="submit">Add website widget</button></div>
        <p id="iframe-add-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
